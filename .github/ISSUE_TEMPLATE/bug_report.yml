name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please don't paste passwords, tokens, keys or other private data.
  - type: input
    id: version
    attributes:
      label: App version
      description: Usually shown in the app's About window or settings.
      placeholder: "for example 1.2.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "for example macOS 15.1, Windows 11 24H2, Android 15"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Download from guruhat.com
        - GitHub Releases
        - Homebrew
        - Scoop
        - winget
        - Microsoft Store
        - Built it myself
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: For example when it started, or whether it happens every time.
